name: tbx606-kernel

# Build the TB-X606F (Lenovo Tab M10 FHD Plus 2nd Gen, MT8768) mainline
# kernel + boot.img + Debian rootfs on GitHub's native Linux runners.
#
# Triggers: push to this branch, or manual dispatch from the Actions tab.

on:
  push:
    branches: [mt6765-devel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: kernel + boot.img
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison bc libssl-dev libelf-dev cpio device-tree-compiler \
            gcc-aarch64-linux-gnu python3

      - name: Configure (tbx606_defconfig)
        run: make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- tbx606_defconfig

      - name: Build Image.gz + DTB
        run: |
          # The dtb lives in arch/arm64/boot/dts/mediatek/, so the target
          # must carry the subdir prefix (top-level %.dtb rule expands to
          # $(dtstree)/$@).
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz mediatek/mt8768-lenovo-tbx606.dtb

      - name: Build modules and pack tarball
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          rm -rf /tmp/mods && mkdir -p /tmp/mods
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               INSTALL_MOD_PATH=/tmp/mods modules_install
          tar czf modules.tar.gz -C /tmp/mods .
          echo "[modules] $(tar tzf modules.tar.gz | wc -l) entries"

      - name: Build initramfs (Alpine + /init)
        run: bash ci/build_initramfs.sh initramfs.cpio.gz

      - name: Pack boot.img (MTK layout)
        run: |
          python3 ci/mkbootimg_mtk.py \
            --kernel arch/arm64/boot/Image.gz \
            --dtb arch/arm64/boot/dts/mediatek/mt8768-lenovo-tbx606.dtb \
            --ramdisk initramfs.cpio.gz \
            -o boot.img

      - name: Sanity-check boot.img structure
        run: |
          python3 - <<'EOF'
          import struct, sys
          d = open('boot.img','rb').read()
          assert d[:8] == b'ANDROID!', 'bad magic'
          ks, ka, rs, ra, ss, sa, ta, ps, hv = struct.unpack('<9I', d[8:44])
          print(f'boot.img: kernel_size={ks} ramdisk_size={rs} page={ps} hdr_v={hv}')
          assert ps == 2048, 'page size must be 2048 (MTK LK)'
          assert hv == 2, 'header version must be 2'
          assert ka == 0x40080000, 'kernel addr must match stock'
          m = d.rfind(b'\xd0\x0d\xfe\xed', 2048, 2048 + ks)
          assert m > 0, 'no FDT magic found in kernel area (DTB not appended?)'
          totalsize = struct.unpack('>I', d[m+4:m+8])[0]
          print(f'DTB at kernel-area offset {m-2048}, totalsize={totalsize}')
          assert m + totalsize == 2048 + ks, 'DTB must end exactly at kernel area end'
          print('BOOT.IMG STRUCTURE OK')
          EOF
          ls -la boot.img arch/arm64/boot/Image.gz \
                arch/arm64/boot/dts/mediatek/mt8768-lenovo-tbx606.dtb

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tbx606-kernel
          retention-days: 30
          if-no-files-found: error
          path: |
            boot.img
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/mediatek/mt8768-lenovo-tbx606.dtb
            modules.tar.gz
            initramfs.cpio.gz

  rootfs:
    name: Debian rootfs image (userdata / eMMC)
    runs-on: ubuntu-24.04
    needs: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs android-sdk-libsparse-utils
          mke2fs -V 2>&1 | head -1
          img2simg -v 2>&1 | head -1 || true

      - name: Download kernel modules artifact
        uses: actions/download-artifact@v4
        with:
          name: tbx606-kernel
          path: artifacts

      - name: Fetch Debian trixie arm64 rootfs (LXC image)
        run: |
          set -euo pipefail
          BASE="https://images.linuxcontainers.org/images/debian/trixie/arm64/default"
          # Discover the newest dated image, e.g. 20261015_05:24
          LATEST=$(curl -fsSL "$BASE/" 2>/dev/null \
                   | grep -oE '[0-9]{8}_[0-9]{2}:[0-9]{2}' | sort -u | tail -1 || true)
          echo "[rootfs] discovered latest: '${LATEST}'"
          # Fall back to a known-good image if discovery fails (listing
          # blocked / changed), so the job does not 404 on an empty path.
          [ -z "$LATEST" ] && LATEST="20261015_05:24"
          echo "[rootfs] using image: $LATEST"
          curl -fsSL --retry 3 --retry-delay 5 \
               -o rootfs.tar.xz "$BASE/$LATEST/rootfs.tar.xz"
          test -s rootfs.tar.xz
          ls -la rootfs.tar.xz
          # xz magic: FD 37 7A 58 5A 00
          test "$(xxd -p -l 6 rootfs.tar.xz)" = "fd377a585a00" \
            || { echo "[rootfs] not an xz archive"; exit 1; }

      - name: Assemble rootfs (modules + basic config)
        run: |
          set -euo pipefail
          rm -rf rootfs && mkdir rootfs
          tar xJf rootfs.tar.xz -C rootfs

          # modules.tar.gz contains ./lib/modules/<KREL>/... (tarred from
          # the modules_install root), so extract it straight into rootfs/
          KREL=$(tar tzf artifacts/modules.tar.gz | grep -m1 -oE '\./lib/modules/[^/]+' | cut -d/ -f4)
          echo "[rootfs] kernel release: $KREL"
          tar xzf artifacts/modules.tar.gz -C rootfs
          test -d "rootfs/lib/modules/$KREL/kernel"
          depmod -b rootfs "$KREL" 2>/dev/null || true

          # Root lives on userdata (mmcblk0p38) -- the standard MTK porting
          # layout: no SD card timing issues, no extra partition to create.
          cat > rootfs/etc/fstab <<'FSTAB'
          # TB-X606F mainline: root on eMMC userdata (mmcblk0p38)
          /dev/mmcblk0p38 /       ext4  defaults,noatime  0 1
          proc            /proc   proc  defaults          0 0
          sysfs           /sys    sysfs defaults          0 0
          devtmpfs        /dev    devtmpfs defaults       0 0
          FSTAB
          echo "tbx606" > rootfs/etc/hostname
          cat > rootfs/etc/hosts <<'HOSTS'
          127.0.0.1 localhost tbx606
          ::1       localhost tbx606
          HOSTS

          # The image is smaller than the real userdata partition; grow the
          # filesystem on first boot so the whole partition becomes usable.
          mkdir -p rootfs/usr/local/sbin rootfs/var/lib
          cat > rootfs/usr/local/sbin/grow-rootfs.sh <<'GROW'
          #!/bin/sh
          # Grow the root filesystem to fill its whole partition (first boot).
          set -e
          SRC=$(findmnt -no SOURCE / 2>/dev/null || true)
          [ -n "$SRC" ] || SRC=/dev/mmcblk0p38
          echo "grow-rootfs: resizing $SRC"
          resize2fs "$SRC" || echo "grow-rootfs: resize failed (non-fatal)"
          mkdir -p /var/lib
          touch /var/lib/grow-rootfs.done
          GROW
          chmod +x rootfs/usr/local/sbin/grow-rootfs.sh
          mkdir -p rootfs/etc/systemd/system
          cat > rootfs/etc/systemd/system/grow-rootfs.service <<'SVC'
          [Unit]
          Description=Grow rootfs to fill the partition
          DefaultDependencies=no
          After=local-fs.target
          Before=sysinit.target
          ConditionPathExists=!/var/lib/grow-rootfs.done

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/grow-rootfs.sh

          [Install]
          WantedBy=sysinit.target
          SVC
          mkdir -p rootfs/etc/systemd/system/sysinit.target.wants
          ln -sf /etc/systemd/system/grow-rootfs.service \
                 rootfs/etc/systemd/system/sysinit.target.wants/grow-rootfs.service

          # serial getty on ttyS0 (POGO UART) for headless access
          mkdir -p rootfs/etc/systemd/system/getty.target.wants
          ln -sf /usr/lib/systemd/system/serial-getty@.service \
                 rootfs/etc/systemd/system/getty.target.wants/serial-getty@ttyS0.service
          # USB gadget serial also gets a getty
          ln -sf /usr/lib/systemd/system/serial-getty@.service \
                 rootfs/etc/systemd/system/getty.target.wants/serial-getty@ttyGS0.service

          # ---- ext4 image, flashable straight to userdata ----
          # 2 GiB is plenty for a base system; grow-rootfs takes the rest on
          # the first boot. sudo is needed so mke2fs -d can preserve owners.
          sudo mke2fs -t ext4 -F -q -d rootfs -b 4096 \
                 -O ^metadata_csum_seed,has_journal,extent \
                 -L tbx606-root rootfs.img 2048M
          echo "[rootfs] raw ext4 image: $(wc -c < rootfs.img) bytes"
          sudo e2fsck -fy rootfs.img || true
          sudo resize2fs -M rootfs.img >/dev/null 2>&1 || true   # shrink to data size
          echo "[rootfs] after shrink: $(wc -c < rootfs.img) bytes"

          # Android sparse image: fastboot-native, holes cost nothing
          img2simg rootfs.img rootfs-sparse.img
          echo "[rootfs] sparse image: $(wc -c < rootfs-sparse.img) bytes"

          tar cJf tbx606-rootfs.tar.xz -C rootfs .
          echo "[rootfs] tbx606-rootfs.tar.xz: $(wc -c < tbx606-rootfs.tar.xz) bytes"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbx606-rootfs
          retention-days: 30
          if-no-files-found: error
          path: |
            rootfs-sparse.img
            rootfs.img
            tbx606-rootfs.tar.xz
